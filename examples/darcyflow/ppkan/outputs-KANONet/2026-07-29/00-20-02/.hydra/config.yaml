mode: test
seed: 0
output_dir: ${hydra:run.dir}
data_dir: ./data/piececonst_r421_N1024_smooth1.mat
device: gpu
dtype: float32
model: KANONet
MLPMODEL:
  branch1_in: 841
  branch1_hidden:
  - 128
  - 128
  trunk_in: 2
  trunk_hidden:
  - 128
  - 128
KANMODEL:
  width_trunk:
  - 2
  - 64
  - 40
  width_branch:
  - 841
  - 64
  - 40
  trunk_min_grid: 0.0
  trunk_max_grid: 1.0
  branch_min_grid: 0.0
  branch_max_grid: 1.0
  grid_count: 3
  branch_kan_func: rbf
  trunk_kan_func: rbf
  grid_opt: false
  apply_base_update: true
  noise_scale: 0.01
  dtype: ${dtype}
TRAIN:
  epochs: 1000
  lr: 0.001
  save_freq: 10
  resume_ep: -1
  batch_size: 32
checkpoint: outputs-KANONet/2026-07-29/00-05-01/KANONet_latest.pdparams
enable_ddp: false
pred_ckpt: null
